name: ci

on:
  push:
    branches: [main]
  pull_request:

# A superseded run on the same ref is cancelled, which frees the macOS runner the
# old run was holding instead of making the new one wait behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all --locked
      - run: cargo build --release --locked

  macos:
    # macOS runners are the scarce ones: they are the slowest to boot and are
    # capped per account, so this leg verifies the Apple build on main only. A
    # pull request gets the Linux run, which covers the same code.
    name: macos
    if: github.event_name == 'push'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all --locked
      - run: cargo build --release --locked
