name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            triple: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: linux-arm64
            triple: aarch64-unknown-linux-gnu
          - os: macos-14
            target: macos-arm64
            triple: aarch64-apple-darwin
          - os: macos-13
            target: macos-x86_64
            triple: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build the released binaries
        run: |
          cargo build --release --locked -p wayfinder -p wayfinder-bench
          mkdir -p dist
          cp target/release/wayfinder dist/
          cp target/release/wayfinder-bench dist/
          tar -czf "wayfinder-${{ matrix.target }}.tar.gz" -C dist wayfinder wayfinder-bench
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "wayfinder-${{ matrix.target }}.tar.gz" > "wayfinder-${{ matrix.target }}.tar.gz.sha256"
          else
            shasum -a 256 "wayfinder-${{ matrix.target }}.tar.gz" > "wayfinder-${{ matrix.target }}.tar.gz.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: wayfinder-${{ matrix.target }}
          path: |
            wayfinder-${{ matrix.target }}.tar.gz
            wayfinder-${{ matrix.target }}.tar.gz.sha256

  wheels:
    name: wheel (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-14
            target: macos-arm64
          - os: macos-13
            target: macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: build the binary and wrap it in a platform wheel
        run: |
          cargo build --release --locked -p wayfinder
          cp target/release/wayfinder python/src/wayfinder_cli/bin/wayfinder
          # The package version tracks the tag, so `wayfinder --version` and
          # `pip show wayfinder-memory` agree.
          python -c "import os,pathlib,re;p=pathlib.Path('python/src/wayfinder_cli/__init__.py');v=os.environ['GITHUB_REF_NAME'].lstrip('v');p.write_text(re.sub(r'__version__ = \".*?\"','__version__ = \"'+v+'\"',p.read_text()))"
          python -m pip install --upgrade build
          python -m build --wheel --outdir dist-wheels python
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: dist-wheels/*.whl

  publish:
    needs: [build, wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: publish the release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "wayfinder $GITHUB_REF_NAME" --generate-notes \
            dist/*.tar.gz dist/*.sha256

  pypi:
    # Trusted publishing: PyPI verifies this workflow through OIDC, so no API
    # token is stored. Register the project as a pending publisher on PyPI and
    # set the repository variable PYPI_PUBLISH=true; without it a release still
    # publishes the binaries and wheels, it just skips the upload.
    if: vars.PYPI_PUBLISH == 'true'
    needs: wheels
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: wheels
          pattern: wheel-*
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheels
