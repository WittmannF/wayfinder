name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    # One Linux runner per architecture, and exactly one Apple runner that
    # produces both Mac artefacts (native arm64 plus a cross-compiled x86_64).
    # macOS images queue unpredictably — a job can wait fifteen minutes for a
    # runner that never comes — so the release asks for one, not two.
    name: build (${{ matrix.group }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            group: linux-x86_64
            triples: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            group: linux-arm64
            triples: aarch64-unknown-linux-gnu
          - os: macos-15
            group: macos
            triples: aarch64-apple-darwin x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triples }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: build every target this runner serves
        run: |
          set -euo pipefail
          mkdir -p dist
          for triple in ${{ matrix.triples }}; do
            cargo build --release --locked --target "$triple" -p wayfinder -p wayfinder-bench
            binary="target/$triple/release/wayfinder"
            # The artefact, not the runner, decides what it is: a cross build makes
            # a host check meaningless, an architecture check does not.
            arch="$(file "$binary")"
            echo "$triple: $arch"
            case "$triple" in
              *x86_64*) echo "$arch" | grep -qiE 'x86-64|x86_64' || { echo "::error::$binary is not x86_64"; exit 1; } ;;
              *aarch64*) echo "$arch" | grep -qiE 'aarch64|arm64' || { echo "::error::$binary is not arm64"; exit 1; } ;;
            esac
            case "$triple" in
              x86_64-unknown-linux-gnu) name=linux-x86_64 ;;
              aarch64-unknown-linux-gnu) name=linux-arm64 ;;
              aarch64-apple-darwin) name=macos-arm64 ;;
              x86_64-apple-darwin) name=macos-x86_64 ;;
            esac
            mkdir -p "dist/$name"
            cp "$binary" "dist/$name/wayfinder"
            cp "target/$triple/release/wayfinder-bench" "dist/$name/wayfinder-bench"
            tar -czf "dist/wayfinder-$name.tar.gz" -C "dist/$name" wayfinder wayfinder-bench
            if command -v sha256sum >/dev/null 2>&1; then
              ( cd dist && sha256sum "wayfinder-$name.tar.gz" > "wayfinder-$name.tar.gz.sha256" )
            else
              ( cd dist && shasum -a 256 "wayfinder-$name.tar.gz" > "wayfinder-$name.tar.gz.sha256" )
            fi
          done

      - name: wrap each binary in a platform wheel
        run: |
          set -euo pipefail
          python -m pip install --upgrade build
          # The package version tracks the tag, so `wayfinder --version` and
          # `pip show wayfinder-memory` agree.
          python -c "import os,pathlib,re;p=pathlib.Path('python/src/wayfinder_cli/__init__.py');v=os.environ['GITHUB_REF_NAME'].lstrip('v');p.write_text(re.sub(r'__version__ = \".*?\"','__version__ = \"'+v+'\"',p.read_text()))"
          for dir in dist/*/; do
            name="$(basename "$dir")"
            [ -f "$dir/wayfinder" ] || continue
            cp "$dir/wayfinder" python/src/wayfinder_cli/bin/wayfinder
            platform=""
            [ "$name" = "macos-x86_64" ] && platform="macosx_11_0_x86_64"
            echo "::group::wheel for $name"
            WAYFINDER_WHEEL_PLATFORM="$platform" python -m build --wheel --outdir "dist/wheels/$name" python
            echo "::endgroup::"
          done
          ls -l dist/wheels/*/

      - name: upload the release assets
        uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.group }}
          path: |
            dist/wayfinder-*.tar.gz
            dist/wayfinder-*.tar.gz.sha256
          if-no-files-found: error
      - name: upload the wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.group }}
          path: dist/wheels/**/*.whl
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: assets-*
          merge-multiple: true
      - name: publish the release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A re-run after a fixed job finds the release already there; replace
          # its assets instead of failing on it.
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "wayfinder $GITHUB_REF_NAME" --generate-notes \
            dist/*.tar.gz dist/*.sha256 \
            || gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
                 dist/*.tar.gz dist/*.sha256

  pypi:
    # Trusted publishing: PyPI verifies this workflow through OIDC, so no API
    # token is stored. Register the project as a pending publisher on PyPI and
    # set the repository variable PYPI_PUBLISH=true; without it a release still
    # publishes the binaries and wheels, it just skips the upload.
    if: vars.PYPI_PUBLISH == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: wheels
          pattern: wheel-*
          # Without this every artifact lands in its own subdirectory
          # (wheels/wheel-linux-arm64/…) and the publisher rejects the folder
          # name as an unknown distribution. Flattened, the four wheels sit
          # directly in wheels/, which is what packages-dir expects.
          merge-multiple: true
      - name: list what will be uploaded
        run: ls -l wheels
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheels
          # A re-run after a fixed job must not fail on files the first attempt
          # already uploaded.
          skip-existing: true
