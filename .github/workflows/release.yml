name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    # One job per platform does everything that platform can do: the tarball, its
    # checksum, and the platform wheel. The Intel macOS binary is cross-compiled on
    # the arm64 image: GitHub's macos-15-intel standard runner queues without
    # starting, and it is retired in 2027 anyway, so one Apple runner produces both
    # Mac artefacts.
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            triple: x86_64-unknown-linux-gnu
            arch: x86-64
          - os: ubuntu-24.04-arm
            target: linux-arm64
            triple: aarch64-unknown-linux-gnu
            arch: aarch64
          - os: macos-15
            target: macos-arm64
            triple: aarch64-apple-darwin
            arch: arm64
          - os: macos-15
            target: macos-x86_64
            triple: x86_64-apple-darwin
            arch: x86_64
            wheel_platform: macosx_11_0_x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: build the released binaries
        run: |
          cargo build --release --locked --target ${{ matrix.triple }} -p wayfinder -p wayfinder-bench
          # The artefact, not the runner, decides the name: a cross build makes a
          # host check meaningless, an architecture check does not.
          file "target/${{ matrix.triple }}/release/wayfinder"
          if ! file "target/${{ matrix.triple }}/release/wayfinder" | grep -qiE '${{ matrix.arch }}'; then
            echo "::error::the built binary is not ${{ matrix.arch }}; refusing to publish a mislabelled artefact"
            exit 1
          fi
          mkdir -p dist
          cp "target/${{ matrix.triple }}/release/wayfinder" dist/
          cp "target/${{ matrix.triple }}/release/wayfinder-bench" dist/
          tar -czf "wayfinder-${{ matrix.target }}.tar.gz" -C dist wayfinder wayfinder-bench
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "wayfinder-${{ matrix.target }}.tar.gz" > "wayfinder-${{ matrix.target }}.tar.gz.sha256"
          else
            shasum -a 256 "wayfinder-${{ matrix.target }}.tar.gz" > "wayfinder-${{ matrix.target }}.tar.gz.sha256"
          fi

      - name: wrap the binary in a platform wheel
        env:
          WAYFINDER_WHEEL_PLATFORM: ${{ matrix.wheel_platform }}
        run: |
          cp dist/wayfinder python/src/wayfinder_cli/bin/wayfinder
          # The package version tracks the tag, so `wayfinder --version` and
          # `pip show wayfinder-memory` agree.
          python -c "import os,pathlib,re;p=pathlib.Path('python/src/wayfinder_cli/__init__.py');v=os.environ['GITHUB_REF_NAME'].lstrip('v');p.write_text(re.sub(r'__version__ = \".*?\"','__version__ = \"'+v+'\"',p.read_text()))"
          python -m pip install --upgrade build
          python -m build --wheel --outdir dist-wheels python
          ls -l dist-wheels

      - uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.target }}
          path: |
            wayfinder-${{ matrix.target }}.tar.gz
            wayfinder-${{ matrix.target }}.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: dist-wheels/*.whl

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: assets-*
          merge-multiple: true
      - name: publish the release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A re-run after a fixed job finds the release already there; replace
          # its assets instead of failing on it.
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "wayfinder $GITHUB_REF_NAME" --generate-notes \
            dist/*.tar.gz dist/*.sha256 \
            || gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
                 dist/*.tar.gz dist/*.sha256

  pypi:
    # Trusted publishing: PyPI verifies this workflow through OIDC, so no API
    # token is stored. Register the project as a pending publisher on PyPI and
    # set the repository variable PYPI_PUBLISH=true; without it a release still
    # publishes the binaries and wheels, it just skips the upload.
    if: vars.PYPI_PUBLISH == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: wheels
          pattern: wheel-*
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheels
