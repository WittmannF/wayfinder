name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    # One Linux runner per architecture, and exactly one Apple runner that
    # produces both Mac artefacts (native arm64 plus a cross-compiled x86_64).
    # macOS images queue unpredictably — a job can wait fifteen minutes for a
    # runner that never comes — so the release asks for one, not two.
    name: build (${{ matrix.group }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Linux rows build inside a manylinux image, so the host image only
          # has to provide Docker; pinning it keeps a runner-image rollover from
          # changing what the release serves.
          - os: ubuntu-24.04
            group: linux-x86_64
            triples: x86_64-unknown-linux-gnu
            container: quay.io/pypa/manylinux_2_28_x86_64
          - os: ubuntu-24.04-arm
            group: linux-arm64
            triples: aarch64-unknown-linux-gnu
            container: quay.io/pypa/manylinux_2_28_aarch64
          - os: macos-15
            group: macos
            triples: aarch64-apple-darwin x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # Linux builds run in a container with its own toolchain, so the hosted
      # toolchain and cache are only wired for the native macOS build.
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ matrix.container == '' }}
        with:
          targets: ${{ matrix.triples }}
      - uses: Swatinem/rust-cache@v2.9.3
        if: ${{ matrix.container == '' }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: build every target this runner serves
        run: |
          set -euo pipefail
          mkdir -p dist
          container='${{ matrix.container }}'
          for triple in ${{ matrix.triples }}; do
            if [ -n "$container" ]; then
              # Built inside the manylinux image, not on the hosted runner: the
              # binary then links glibc 2.28 (Ubuntu 20.04, Debian 10, RHEL 8)
              # instead of whatever the runner image happens to ship, which is
              # what locked every older distribution out of the last release.
              docker run --rm --volume "$PWD:/work" --workdir /work \
                --env CARGO_HOME=/cargo "$container" bash -lc "
                  set -euo pipefail
                  curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
                    | sh -s -- -y --profile minimal --no-modify-path
                  export PATH="\$CARGO_HOME/bin:\$PATH"
                  cargo build --release --locked --target $triple -p wayfinder -p wayfinder-bench
                "
            else
              cargo build --release --locked --target "$triple" -p wayfinder -p wayfinder-bench
            fi
            binary="target/$triple/release/wayfinder"
            # The artefact, not the runner, decides what it is: a cross build makes
            # a host check meaningless, an architecture check does not.
            arch="$(file "$binary")"
            echo "$triple: $arch"
            case "$triple" in
              *x86_64*) echo "$arch" | grep -qiE 'x86-64|x86_64' || { echo "::error::$binary is not x86_64"; exit 1; } ;;
              *aarch64*) echo "$arch" | grep -qiE 'aarch64|arm64' || { echo "::error::$binary is not arm64"; exit 1; } ;;
            esac
            case "$triple" in
              x86_64-unknown-linux-gnu) name=linux-x86_64 ;;
              aarch64-unknown-linux-gnu) name=linux-arm64 ;;
              aarch64-apple-darwin) name=macos-arm64 ;;
              x86_64-apple-darwin) name=macos-x86_64 ;;
            esac
            mkdir -p "dist/$name"
            cp "$binary" "dist/$name/wayfinder"
            cp "target/$triple/release/wayfinder-bench" "dist/$name/wayfinder-bench"
            tar -czf "dist/wayfinder-$name.tar.gz" -C "dist/$name" wayfinder wayfinder-bench
            if command -v sha256sum >/dev/null 2>&1; then
              ( cd dist && sha256sum "wayfinder-$name.tar.gz" > "wayfinder-$name.tar.gz.sha256" )
            else
              ( cd dist && shasum -a 256 "wayfinder-$name.tar.gz" > "wayfinder-$name.tar.gz.sha256" )
            fi
          done

      - name: wrap each binary in a platform wheel
        run: |
          set -euo pipefail
          python -m pip install --upgrade build
          # The package version tracks the tag, so `wayfinder --version` and
          # `pip show wayfinder-memory` agree.
          python -c "import os,pathlib,re;p=pathlib.Path('python/src/wayfinder_cli/__init__.py');v=os.environ['GITHUB_REF_NAME'].lstrip('v');p.write_text(re.sub(r'__version__ = \".*?\"','__version__ = \"'+v+'\"',p.read_text()))"
          # PyPI refuses a plain `linux_*` tag, and a macOS floor of the runner's
          # own version locks out every older Mac. Each wheel states the platform
          # it actually serves: macOS pinned to 11.0, Linux to the manylinux
          # baseline its binary was built against.
          mkdir -p dist/wheels
          for dir in dist/*/; do
            name="$(basename "$dir")"
            [ -f "$dir/wayfinder" ] || continue
            cp "$dir/wayfinder" python/src/wayfinder_cli/bin/wayfinder
            case "$name" in
              macos-arm64)  platform=macosx_11_0_arm64 ;;
              macos-x86_64) platform=macosx_11_0_x86_64 ;;
              linux-x86_64) platform=manylinux_2_28_x86_64 ;;
              linux-arm64)  platform=manylinux_2_28_aarch64 ;;
              *) echo "::error::no wheel platform for $name"; exit 1 ;;
            esac
            # The tag is a claim about the binary, so read the binary: a symbol
            # above the baseline fails here instead of at a user's first run.
            case "$platform" in
              manylinux_2_28_*)
                highest="$(strings "$dir/wayfinder" | grep -oE 'GLIBC_2\.[0-9]+' | sed 's/GLIBC_2\.//' | sort -n | tail -1 || true)"
                if [ -n "$highest" ] && [ "$highest" -gt 28 ]; then
                  echo "::error::$name links GLIBC_2.$highest, above the manylinux_2_28 baseline"
                  exit 1
                fi
                ;;
            esac
            echo "::group::wheel for $name ($platform)"
            WAYFINDER_WHEEL_PLATFORM="$platform" python -m build --wheel --outdir dist/wheels python
            echo "::endgroup::"
          done
          # A wheel that does not carry the tag we meant to give it fails here,
          # not at PyPI with a 400 after the release has been published.
          ls -l dist/wheels
          for wheel in dist/wheels/*.whl; do
            case "$(basename "$wheel")" in
              *-py3-none-macosx_11_0_arm64.whl|*-py3-none-macosx_11_0_x86_64.whl|*-py3-none-manylinux_2_28_*.whl) : ;;
              *) echo "::error::unexpected wheel tag: $wheel"; exit 1 ;;
            esac
          done

      - name: upload the release assets
        uses: actions/upload-artifact@v7
        with:
          name: assets-${{ matrix.group }}
          path: |
            dist/wayfinder-*.tar.gz
            dist/wayfinder-*.tar.gz.sha256
          if-no-files-found: error
      - name: upload the wheels
        uses: actions/upload-artifact@v7
        with:
          # Flat on purpose: a glob that reaches into subdirectories makes
          # upload-artifact keep them, and the publisher then offers a directory
          # to twine, which rejects it as an unknown distribution.
          name: wheel-${{ matrix.group }}
          path: dist/wheels/*.whl
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: assets-*
          merge-multiple: true
      - name: publish the release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A re-run after a fixed job finds the release already there; replace
          # its assets instead of failing on it.
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "wayfinder $GITHUB_REF_NAME" --generate-notes \
            dist/*.tar.gz dist/*.sha256 \
            || gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
                 dist/*.tar.gz dist/*.sha256

  pypi:
    # Trusted publishing: PyPI verifies this workflow through OIDC, so no API
    # token is stored. Register the project as a pending publisher on PyPI and
    # set the repository variable PYPI_PUBLISH=true; without it a release still
    # publishes the binaries and wheels, it just skips the upload.
    if: vars.PYPI_PUBLISH == 'true'
    needs: build
    # If the PyPI pending publisher names an environment, declare the same one here
    # (`environment: pypi`); a mismatch is an OIDC claim failure, not an upload
    # failure. Leaving it unnamed on both sides is the simplest correct choice.
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: wheels
          pattern: wheel-*
          # Without this every artifact lands in its own subdirectory
          # (wheels/wheel-linux-arm64/…) and the publisher rejects the folder
          # name as an unknown distribution. Flattened, the four wheels sit
          # directly in wheels/, which is what packages-dir expects.
          merge-multiple: true
      - name: assert a flat directory of wheels
        run: |
          set -euo pipefail
          nested="$(find wheels -mindepth 1 -type d -print -quit)"
          if [ -n "$nested" ]; then
            echo "::error::artifacts unpacked a directory ($nested); the publisher would read it as a distribution"
            find wheels -type f | head -20
            exit 1
          fi
          count="$(find wheels -maxdepth 1 -name '*.whl' | wc -l | tr -d ' ')"
          echo "wheels found: $count"
          ls -l wheels
          [ "$count" -ge 1 ] || { echo "::error::no wheels to publish"; exit 1; }
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheels
          # A re-run after a fixed job must not fail on files the first attempt
          # already uploaded.
          skip-existing: true
          # The failure this job reports is an OIDC exchange with PyPI, and the
          # short form says only "failure". Verbose prints the claims PyPI saw,
          # which is what tells a missing pending publisher from a mismatched one.
          verbose: true
